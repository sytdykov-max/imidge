name: Lighthouse CI

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Target URL"
        required: false
        default: "http://127.0.0.1:3002"

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run placeholder Lighthouse gate
        run: |
          echo "Lighthouse target: ${{ inputs.site_url }}"
          npm run check:storefront-bundle-budget
